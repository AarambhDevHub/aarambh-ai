[package]
name = "aarambh-ai"
version.workspace = true
publish = false
edition.workspace = true
rust-version.workspace = true

[features]
default = []
cuda = [
    "aarambh-ai-agent/cuda",
    "aarambh-ai-core/cuda",
    "aarambh-ai-data/cuda",
    "aarambh-ai-distill/cuda",
    "aarambh-ai-eval/cuda",
    "aarambh-ai-finetune/cuda",
    "aarambh-ai-inference/cuda",
    "aarambh-ai-model/cuda",
    "aarambh-ai-quant/cuda",
    "aarambh-ai-safety/cuda",
    "aarambh-ai-serve/cuda",
    "aarambh-ai-selflearn/cuda",
    "aarambh-ai-train/cuda",
    "aarambh-ai-vision/cuda",
    "aarambh-ai-weights/cuda",
    "candle-core/nccl",
]

[dependencies]
aarambh-ai-agent     = { path = "../crates/aarambh-ai-agent" }
aarambh-ai-core      = { path = "../crates/aarambh-ai-core" }
aarambh-ai-data      = { path = "../crates/aarambh-ai-data" }
aarambh-ai-distill   = { path = "../crates/aarambh-ai-distill" }
aarambh-ai-eval      = { path = "../crates/aarambh-ai-eval" }
aarambh-ai-finetune  = { path = "../crates/aarambh-ai-finetune" }
aarambh-ai-inference = { path = "../crates/aarambh-ai-inference" }
aarambh-ai-model     = { path = "../crates/aarambh-ai-model" }
aarambh-ai-quant     = { path = "../crates/aarambh-ai-quant" }
aarambh-ai-safety    = { path = "../crates/aarambh-ai-safety" }
aarambh-ai-serve     = { path = "../crates/aarambh-ai-serve" }
aarambh-ai-selflearn = { path = "../crates/aarambh-ai-selflearn" }
aarambh-ai-tokenizer = { path = "../crates/aarambh-ai-tokenizer" }
aarambh-ai-train     = { path = "../crates/aarambh-ai-train" }
aarambh-ai-vision    = { path = "../crates/aarambh-ai-vision" }
aarambh-ai-weights   = { path = "../crates/aarambh-ai-weights" }
anyhow               = { workspace = true }
candle-core          = { workspace = true }
candle-nn            = { workspace = true }
clap                 = { workspace = true }
serde                = { workspace = true }
serde_json           = { workspace = true }
tokio                = { workspace = true }
tracing              = { workspace = true }
tracing-subscriber   = { workspace = true }
