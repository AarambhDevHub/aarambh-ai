[package]
name = "aarambh-studio-nn"
version.workspace = true
publish = false
edition.workspace = true
rust-version.workspace = true

[features]
default = []
cuda = [
    "aarambh-studio-core/cuda",
    "aarambh-studio-kernel/cuda",
    "aarambh-studio-quant/cuda",
    "candle-core/cuda",
    "candle-nn/cuda",
]

[dependencies]
aarambh-studio-core = { path = "../aarambh-studio-core" }
aarambh-studio-kernel = { path = "../aarambh-studio-kernel" }
aarambh-studio-quant = { path = "../aarambh-studio-quant" }
candle-core      = { workspace = true }
candle-nn        = { workspace = true }

[dev-dependencies]
aarambh-studio-core = { path = "../aarambh-studio-core" }
candle-core      = { workspace = true }
candle-nn        = { workspace = true }
