edition.workspace = true
rust-version.workspace = true

[features]
default = []
cuda = [
    "aarambh-ai-core/cuda",
    "aarambh-ai-model/cuda",
    "aarambh-ai-quant/cuda",
    "candle-core/cuda",
    "candle-nn/cuda",
