dataset_path = "data/distill_smoke_prompts.jsonl"
tokenizer_path = "checkpoints/mtp_smoke/tokenizer.json"
vocab_size = 8000
validation_split = 0.0
shuffle = false
resume = false
device = "cpu"
dtype = "f32"

[model]
vocab_size = 8000
hidden_dim = 128
ffn_dim = 256
n_layers = 2
n_heads = 2
n_kv_heads = 1
max_seq_len = 64
rope_theta = 10000.0
norm_eps = 0.00001
tie_embeddings = true

[model.mtp]
num_future_tokens = 2
aux_loss_weight = 0.3

[train]
lr = 0.00002
batch_size = 1
grad_accum_steps = 1
max_epochs = 2
max_steps = 2
warmup_steps = 0
min_lr_ratio = 0.1
weight_decay = 0.0
beta1 = 0.9
beta2 = 0.95
epsilon = 0.00000001
clip_grad_norm = 1.0
save_every_n_steps = 1
log_every_n_steps = 1
eval_steps = 0
seed = 42
checkpoint_dir = "checkpoints/distill_smoke"
