dataset_path = "data/wikitext-103-raw/wiki.train.raw"
tokenizer_path = "checkpoints/wikitext103_large/tokenizer.json"
vocab_size = 32000
validation_split = 0.01
shuffle = true
resume = false
retrofit_from = "checkpoints/wikitext103_large_hybrid/model.safetensors"
retrofit_lr_scale = 0.1
device = "cuda:0"
dtype = "bf16"

[model]
vocab_size = 32000
hidden_dim = 2048
ffn_dim = 6656
n_layers = 24
n_heads = 32
n_kv_heads = 8
max_seq_len = 16384
rope_theta = 500000.0
norm_eps = 0.00001
tie_embeddings = true

[model.rope_scaling]
method = "yarn"
factor = 4.0
original_max_seq_len = 4096
beta_fast = 32.0
beta_slow = 1.0
attention_factor = 1.0

# Phase 41 three-way hybrid: Full + Gated DeltaNet + LatentMLA at Large scale.
#   full_attention_every_n = 4 -> layers 0,4,8,12,16,20 stay Full
#   mla_layers = [2,6,10,14,18,22] -> six Gated DeltaNet slots become LatentMLA
[model.attention_schedule]
full_attention_every_n = 4
mla_layers = [2, 6, 10, 14, 18, 22]

[model.attention_schedule.gated_deltanet]
n_heads = 16
key_head_dim = 128
value_head_dim = 256
conv_kernel_size = 4
chunk_size = 64

[model.attention_schedule.mla]
latent_dim = 768
rope_head_dim = 16
# Derived: n_heads=32, nope_head_dim=64-16=48, value_head_dim=48.
# MLA per-token cache = 768 + 16 = 784 elements
# vs full-attention per-token cache = 2 * 8 * 64 = 1024 elements (~1.30x smaller).
# A larger latent_dim preserves more per-head expressiveness at Large scale.

[train]
lr = 0.0001
batch_size = 1
grad_accum_steps = 32
max_epochs = 1
max_steps = 30000
warmup_steps = 1000
min_lr_ratio = 0.1
weight_decay = 0.1
beta1 = 0.9
beta2 = 0.95
epsilon = 0.00000001
clip_grad_norm = 1.0
save_every_n_steps = 2500
log_every_n_steps = 10
eval_steps = 500
seed = 42
checkpoint_dir = "checkpoints/wikitext103_large_hybrid_mla"
