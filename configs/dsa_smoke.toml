dataset_path = "data/tiny_shakespeare.txt"
tokenizer_save_path = "checkpoints/dsa_smoke/tokenizer.json"
vocab_size = 8000
validation_split = 0.01
shuffle = true
resume = false
device = "cpu"
dtype = "f32"

[model]
vocab_size = 8000
hidden_dim = 128
ffn_dim = 256
n_layers = 2
n_heads = 2
n_kv_heads = 1
max_seq_len = 64
rope_theta = 10000.0
norm_eps = 0.00001
tie_embeddings = true

[model.attention_schedule]
full_attention_every_n = 2

[model.attention_schedule.gated_deltanet]
n_heads = 1
key_head_dim = 32
value_head_dim = 64
conv_kernel_size = 4
chunk_size = 16

[model.dsa_config]
block_size = 16
top_k_blocks = 2
min_seq_len_for_sparsity = 32

[dsa_training]
teacher_every_n_steps = 8
indexer_loss_weight = 1.0

[train]
lr = 0.001
batch_size = 1
grad_accum_steps = 1
max_epochs = 1
max_steps = 2
warmup_steps = 0
min_lr_ratio = 1.0
weight_decay = 0.0
beta1 = 0.9
beta2 = 0.95
epsilon = 0.00000001
clip_grad_norm = 1.0
save_every_n_steps = 0
log_every_n_steps = 1
eval_steps = 0
seed = 42
checkpoint_dir = "checkpoints/dsa_smoke"
