dataset_path = "data/distill_prompts.jsonl"
tokenizer_path = "checkpoints/wikitext103_medium/tokenizer.json"
vocab_size = 32000
validation_split = 0.0
shuffle = true
resume = false
device = "cuda:0"
dtype = "bf16"

[model]
vocab_size = 32000
hidden_dim = 1024
ffn_dim = 3392
n_layers = 24
n_heads = 16
n_kv_heads = 8
max_seq_len = 16384
rope_theta = 500000.0
norm_eps = 0.00001
tie_embeddings = true

[model.rope_scaling]
method = "yarn"
factor = 8.0
original_max_seq_len = 2048
beta_fast = 32.0
beta_slow = 1.0
attention_factor = 1.0

[model.attention_schedule]
full_attention_every_n = 4

[model.attention_schedule.gated_deltanet]
n_heads = 8
key_head_dim = 96
value_head_dim = 192
conv_kernel_size = 4
chunk_size = 64

[model.dsa_config]
block_size = 64
top_k_blocks = 16
min_seq_len_for_sparsity = 2048

[model.moe]
num_experts = 8
top_k = 8
expert_ffn_dim = 1696
aux_loss_weight = 0.01
every_n_layers = 2
fine_grained_factor = 4
num_shared_experts = 1

[model.mtp]
num_future_tokens = 2
aux_loss_weight = 0.1

[dsa_training]
teacher_every_n_steps = 8
indexer_loss_weight = 1.0

[train]
lr = 0.00002
batch_size = 1
grad_accum_steps = 8
max_epochs = 100
max_steps = 10000
warmup_steps = 500
min_lr_ratio = 0.1
weight_decay = 0.1
beta1 = 0.9
beta2 = 0.95
epsilon = 0.00000001
clip_grad_norm = 1.0
save_every_n_steps = 500
log_every_n_steps = 10
eval_steps = 0
seed = 42
checkpoint_dir = "checkpoints/wikitext103_medium_distill"
