dataset_path = "data/tiny_shakespeare.txt"
tokenizer_save_path = "checkpoints/mla_smoke/tokenizer.json"
vocab_size = 8000
validation_split = 0.01
shuffle = true
resume = false
device = "cpu"
dtype = "f32"

[model]
vocab_size = 8000
hidden_dim = 128
ffn_dim = 256
n_layers = 2
n_heads = 2
n_kv_heads = 1
max_seq_len = 64
rope_theta = 10000.0
norm_eps = 0.00001
tie_embeddings = true

# Phase 41 hybrid schedule: layer 0 = LatentMLA, layer 1 = Gated DeltaNet.
# `full_attention_every_n = 2` would mark layer 0 as Full, but `mla_layers = [0]`
# upgrades it to LatentMLA (MLA takes precedence over the every-n rule and the
# DSA override). A zero-MLA schedule reproduces v3.0.0 exactly.
[model.attention_schedule]
full_attention_every_n = 2
mla_layers = [0]

[model.attention_schedule.gated_deltanet]
n_heads = 1
key_head_dim = 32
value_head_dim = 64
conv_kernel_size = 4
chunk_size = 16

[model.attention_schedule.mla]
latent_dim = 64
rope_head_dim = 16
# nope_head_dim, value_head_dim, n_heads default to 0 and are derived:
#   n_heads = model.n_heads = 2
#   nope_head_dim = host_head_dim - rope_head_dim = 64 - 16 = 48
#   value_head_dim = nope_head_dim = 48
# Per-token MLA cache = latent_dim + rope_head_dim = 80 elements
# vs GQA baseline = 2 * n_kv_heads * head_dim = 2 * 1 * 64 = 128 elements.

[train]
lr = 0.001
batch_size = 1
grad_accum_steps = 1
max_epochs = 1
max_steps = 2
warmup_steps = 0
min_lr_ratio = 1.0
weight_decay = 0.0
beta1 = 0.9
beta2 = 0.95
epsilon = 0.00000001
clip_grad_norm = 1.0
save_every_n_steps = 0
log_every_n_steps = 1
eval_steps = 0
seed = 42
checkpoint_dir = "checkpoints/mla_smoke"
